[package]
name = "vmctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small host-side CLI for QEMU/KVM virtual machines"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
] }

[[bin]]
name = "vmctl"
path = "src/main.rs"
